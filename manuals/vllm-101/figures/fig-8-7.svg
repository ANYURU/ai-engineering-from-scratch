<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 252" role="img" aria-labelledby="fig-8-7-title fig-8-7-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-7-title">One verify pass keeps the guesses up to the first rejection, plus one token</title>
  <desc id="fig-8-7-desc">A proposer guesses three tokens. The target model runs once over them. The first two match the target and stay. The third is rejected, so the target samples its own token there and the step ends. The step wrote three tokens in one target pass instead of one.</desc>
  <defs><marker id="fig-8-7-head-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-plum-ink, #8a3d72)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">PROPOSER GUESSES, 3 TOKENS</text>
  <rect x="20" y="28" width="116" height="40" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="78" y="51.75" font-size="12.5" text-anchor="middle" font-weight="700">Paris</text>
  <rect x="150" y="28" width="116" height="40" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="208" y="51.75" font-size="12.5" text-anchor="middle" font-weight="700">is</text>
  <rect x="280" y="28" width="116" height="40" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="338" y="51.75" font-size="12.5" text-anchor="middle" font-weight="700">big</text>
  <rect x="20" y="114" width="116" height="40" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="78" y="137.75" font-size="12.5" text-anchor="middle" font-weight="700">kept</text>
  <line x1="78" y1="68" x2="78" y2="113" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-8-7-head-plum)"/>
  <rect x="150" y="114" width="116" height="40" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="208" y="137.75" font-size="12.5" text-anchor="middle" font-weight="700">kept</text>
  <line x1="208" y1="68" x2="208" y2="113" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-8-7-head-plum)"/>
  <rect x="280" y="114" width="116" height="40" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="338" y="137.75" font-size="12.5" text-anchor="middle" font-weight="700">rejected</text>
  <line x1="338" y1="68" x2="338" y2="113" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-8-7-head-plum)"/>
  <rect x="410" y="114" width="120" height="40" fill="var(--m-plum-fill, #f4e6ef)" stroke="var(--m-plum-ink, #8a3d72)"/>
  <text x="470" y="129.25" font-size="12.5" text-anchor="middle" font-weight="700">the</text>
  <text x="470" y="146.55" font-size="11" text-anchor="middle" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">target token</text>
  <line x1="396" y1="134" x2="409" y2="134" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-8-7-head-plum)"/>
  <text x="20" y="186" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">The target model checks all three guesses in one pass.</text>
  <text x="20" y="208" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">Output of this step: Paris is the, three tokens from one pass of the target.</text>
  <text x="20" y="230" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">A step always writes at least one token and at most the guesses plus one.</text>
</svg>
