  <text x="192" y="22" font-size="11" fill="var(--m-violet-ink, #5b4fa3)">Qwen3-1.7B, 2.8 times the size</text>
  <text x="60" y="314" font-size="12" class="m-serif">The update grew 1.4 times. Release and resume grew 2.4 and 1.8 times.</text>
