  <text x="480" y="217.78" font-size="11" text-anchor="middle" fill="var(--m-blue-ink, #2f5d9a)">0.81 s</text>
  <text x="480" y="273" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">resume 0.6B</text>
  <rect x="547.33" y="198.53" width="52" height="57.47" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="573.33" y="192.53" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">1.44 s</text>
