<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-2-4-title fig-2-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-2-4-title">A larger model costs more to release than to update</title>
  <desc id="fig-2-4-desc">Median seconds over 4 short steps. Weight update: 0.64 s for Qwen3-0.6B and 0.91 s for Qwen3-1.7B. Release: 1.59 and 3.83 s. Resume: 0.81 and 1.44 s.</desc>
  <line x1="60" y1="256" x2="620" y2="256" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="54" y="260" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="60" y1="156" x2="620" y2="156" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="54" y="160" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">2.5</text>
  <line x1="60" y1="56" x2="620" y2="56" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="54" y="60" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">5</text>
  <line x1="60" y1="256" x2="620" y2="256" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="60" y1="56" x2="60" y2="256" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="60" y="44" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">seconds, median of 4 steps</text>
  <rect x="80.67" y="230.33" width="52" height="25.67" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="106.67" y="224.33" font-size="11" text-anchor="middle" fill="var(--m-blue-ink, #2f5d9a)">0.64 s</text>
  <text x="106.67" y="273" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">update 0.6B</text>
  <rect x="174" y="219.7" width="52" height="36.3" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="200" y="213.7" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">0.91 s</text>
  <text x="200" y="273" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">update 1.7B</text>
  <rect x="267.33" y="192.4" width="52" height="63.6" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="293.33" y="186.4" font-size="11" text-anchor="middle" fill="var(--m-blue-ink, #2f5d9a)">1.59 s</text>
  <text x="293.33" y="273" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">release 0.6B</text>
  <rect x="360.67" y="102.72" width="52" height="153.28" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="386.67" y="96.72" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">3.83 s</text>
  <text x="386.67" y="273" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">release 1.7B</text>
