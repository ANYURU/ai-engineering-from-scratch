<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-8-4-title fig-8-4-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-8-4-title">The engine and the trainer take turns on one memory</title>
  <desc id="fig-8-4-desc">One colocated step drawn to scale from the medians of 48 steps. The engine holds its weights and its KV cache during rollout, 47.5 s. It releases them in 0.76 s. The trainer computes log probabilities, 23.4 s, and trains, 100.3 s. The engine resumes in 0.87 s and gets the new weights in 0.64 s.</desc>
  <text x="20" y="28" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">PHASE MEDIANS OF 48 STEPS, TO SCALE</text>
  <text x="20" y="74" font-size="12" font-weight="700" fill="var(--m-violet-ink, #5b4fa3)">engine</text>
  <text x="20" y="92" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">weights, KV cache</text>
  <rect x="160" y="58" width="125.98" height="40" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="222.99" y="83" font-size="11.5" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">rollout 47.5 s</text>
  <rect x="616.01" y="58" width="5.99" height="40" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="20" y="144" font-size="12" font-weight="700" fill="var(--m-blue-ink, #2f5d9a)">trainer</text>
  <text x="20" y="162" font-size="11" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">weights, optimizer</text>
  <rect x="287.98" y="128" width="328.03" height="40" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="452" y="153" font-size="11.5" text-anchor="middle" fill="var(--m-blue-ink, #2f5d9a)">log-probs and train 123.7 s</text>
  <line x1="285.98" y1="50" x2="285.98" y2="176" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="616.01" y1="50" x2="616.01" y2="176" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="289.98" y="196" font-size="11" fill="var(--m-amber-ink, #85590c)">release 0.76 s</text>
  <text x="612.01" y="196" font-size="11" text-anchor="end" fill="var(--m-amber-ink, #85590c)">resume and update 1.50 s</text>
  <text x="20" y="244" font-size="12" class="m-serif">Only one side holds the GPU memory at a time.</text>
  <text x="20" y="266" font-size="12" class="m-serif">The hand-offs take about 2 s of a step of about 2.5 minutes.</text>
  <text x="20" y="300" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">On a GB10 a release frees the allocation. The bytes stay in the same memory.</text>
</svg>
