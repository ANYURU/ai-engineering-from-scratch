  <text x="480" y="277" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">resume</text>
  <rect x="547.67" y="258.72" width="51.33" height="1.28" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="573.33" y="252.72" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">0.64 s</text>
  <text x="573.33" y="277" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">update</text>
  <text x="60" y="312" font-size="12" class="m-serif">Tune training and rollout first. The three amber phases add up to about 2 s.</text>
</svg>
