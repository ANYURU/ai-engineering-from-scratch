<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="fig-1-1b-title fig-1-1b-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-1-1b-title">Where the time of one step goes</title>
  <desc id="fig-1-1b-desc">Median seconds per phase over 48 steps with no heat pause, Qwen3-0.6B on one GB10: rollout 47.5, log probabilities 23.4, train 100.3, release 0.76, resume 0.87, and weight update 0.64.</desc>
  <line x1="60" y1="260" x2="620" y2="260" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="54" y="264" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">0</text>
  <line x1="60" y1="210" x2="620" y2="210" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="54" y="214" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">25</text>
  <line x1="60" y1="160" x2="620" y2="160" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="54" y="164" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">50</text>
  <line x1="60" y1="110" x2="620" y2="110" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="54" y="114" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">75</text>
  <line x1="60" y1="60" x2="620" y2="60" stroke="var(--m-ink-mute, #6f6f6a)" stroke-width="1" stroke-opacity="0.25"/>
  <text x="54" y="64" font-size="11" text-anchor="end" fill="var(--m-ink-soft, #4a4a4a)">100</text>
  <line x1="60" y1="260" x2="620" y2="260" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <line x1="60" y1="40" x2="60" y2="260" stroke="var(--m-ink, #1a1a1a)" stroke-width="1"/>
  <text x="60" y="28" font-size="11.5" class="m-serif" fill="var(--m-ink-soft, #4a4a4a)">seconds per step, median</text>
  <rect x="81" y="165.01" width="51.33" height="94.99" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="106.67" y="159.01" font-size="11" text-anchor="middle" fill="var(--m-violet-ink, #5b4fa3)">47.5 s</text>
  <text x="106.67" y="277" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">rollout</text>
  <rect x="174.33" y="213.24" width="51.33" height="46.76" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="200" y="207.24" font-size="11" text-anchor="middle" fill="var(--m-blue-ink, #2f5d9a)">23.4 s</text>
  <text x="200" y="277" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">log-probs</text>
  <rect x="267.67" y="59.42" width="51.33" height="200.58" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="293.33" y="53.42" font-size="11" text-anchor="middle" fill="var(--m-blue-ink, #2f5d9a)">100.3 s</text>
  <text x="293.33" y="277" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">train</text>
  <rect x="361" y="258.49" width="51.33" height="1.51" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="386.67" y="252.49" font-size="11" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">0.76 s</text>
  <text x="386.67" y="277" font-size="11" text-anchor="middle" fill="var(--m-ink-soft, #4a4a4a)">release</text>
  <rect x="454.33" y="258.27" width="51.33" height="1.73" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
